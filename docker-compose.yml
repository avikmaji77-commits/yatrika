version: '3.8'

services:
  backend:
    build: ./backend
    container_name: yatrika-backend
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    ports:
      - "5000:5000"
    networks:
      - yatrika-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yatrika-frontend
    environment:
      - VITE_API_BASE_URL=http://backend:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - yatrika-network

volumes:
  backend_data:

networks:
  yatrika-network:
    driver: bridge
